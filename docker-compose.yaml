# Local-only compose for hand-testing the gateway in a container.
# Mounts catalog/ and consumers/ read-only so editing yaml in the repo
# flows through without rebuilding the image. .env at the repo root
# supplies provider API keys (loaded automatically by compose).
# consumers/ ships with example.yaml — see README "Caller registration".

services:
  llmgate:
    build: .
    image: llmgate:dev
    depends_on:
      nats:
        condition: service_started
      nats-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      LLMGATE_OPENCODE_API_KEY: ${LLMGATE_OPENCODE_API_KEY}
      LLMGATE_OPENROUTER_API_KEY: ${LLMGATE_OPENROUTER_API_KEY:-}
      LLMGATE_CATALOG: /etc/llmgate/catalog
      LLMGATE_CONSUMERS: /etc/llmgate/consumers
      LLMGATE_LOG_LEVEL: info
      LLMGATE_METRICS_ENABLED: ${LLMGATE_METRICS_ENABLED:-true}
      LLMGATE_LLMRESULT_NATS_URL: ${LLMGATE_LLMRESULT_NATS_URL:-nats://nats:4222}
      LLMGATE_LLMRESULT_NATS_SUBJECT: ${LLMGATE_LLMRESULT_NATS_SUBJECT:-llmgate.llmresult.finalized}
      # Defaults match monitoring/nats/nats.conf accounts.APP.users.
      # Prod wires these from the nats-auth Secret via ExternalSecret.
      LLMGATE_LLMRESULT_NATS_USER: ${LLMGATE_LLMRESULT_NATS_USER:-llmgate}
      LLMGATE_LLMRESULT_NATS_PASSWORD: ${LLMGATE_LLMRESULT_NATS_PASSWORD:-llmgate-local}
      LLMGATE_LLMRESULT_ASYNC_QUEUE_SIZE: ${LLMGATE_LLMRESULT_ASYNC_QUEUE_SIZE:-1000}
      LLMGATE_LLMRESULT_ASYNC_BATCH_SIZE: ${LLMGATE_LLMRESULT_ASYNC_BATCH_SIZE:-100}
      LLMGATE_LLMRESULT_ASYNC_FLUSH_INTERVAL: ${LLMGATE_LLMRESULT_ASYNC_FLUSH_INTERVAL:-1s}
      # Audit sink (local-rotate + best-effort S3 upload). Set, so it
      # takes priority over the NATS sink above. Short cadences here so a
      # hand-test surfaces objects in MinIO within a minute.
      LLMGATE_AUDIT_DIR: /var/lib/llmgate/audit
      LLMGATE_AUDIT_ROTATE_INTERVAL: ${LLMGATE_AUDIT_ROTATE_INTERVAL:-1m}
      LLMGATE_AUDIT_UPLOAD_INTERVAL: ${LLMGATE_AUDIT_UPLOAD_INTERVAL:-30s}
      LLMGATE_AUDIT_RETENTION: ${LLMGATE_AUDIT_RETENTION:-10m}
      LLMGATE_AUDIT_S3_ENDPOINT: ${LLMGATE_AUDIT_S3_ENDPOINT:-minio:9000}
      LLMGATE_AUDIT_S3_BUCKET: ${LLMGATE_AUDIT_S3_BUCKET:-llm-audit}
      LLMGATE_AUDIT_S3_ACCESS_KEY: ${LLMGATE_AUDIT_S3_ACCESS_KEY:-minioadmin}
      LLMGATE_AUDIT_S3_SECRET_KEY: ${LLMGATE_AUDIT_S3_SECRET_KEY:-minioadmin}
      LLMGATE_AUDIT_S3_USE_SSL: "false"
      LLMGATE_AUDIT_S3_PATH_STYLE: "true"
    volumes:
      - ./catalog:/etc/llmgate/catalog:ro
      - ./consumers:/etc/llmgate/consumers:ro
      - audit-data:/var/lib/llmgate/audit
    restart: "no"

  nats:
    image: nats:2-alpine
    command:
      - "-c"
      - "/etc/nats/nats.conf"
      - "-m"
      - "8222"
    ports:
      - "${LLMGATE_NATS_PORT:-4222}:4222"
      - "${LLMGATE_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - ./monitoring/nats/nats.conf:/etc/nats/nats.conf:ro
    restart: "no"

  # Mirrors what NACK provisions in prod (see multi-cluster-gitops
  # platform/nats/manifests/oci-prod-osaka/stream.yaml). llmgate no
  # longer creates streams itself, so local stacks need this one-shot.
  # Uses the nack user from monitoring/nats/nats.conf — that account
  # has the broad publish permission needed to talk to $JS.API.STREAM.*.
  nats-init:
    image: natsio/nats-box:0.18.0
    depends_on:
      - nats
    restart: "no"
    environment:
      NATS_URL: "nats://nack:nack-local@nats:4222"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until nats server check connection; do sleep 1; done &&
        nats stream add LLMRESULT
        --subjects 'llmgate.llmresult.finalized'
        --storage file --retention limits --discard old
        --max-bytes=10737418240 --max-age=2160h --dupe-window=2m
        --max-msgs=-1 --max-msgs-per-subject=-1 --max-msg-size=-1
        --max-consumers=-1 --replicas 1 --no-allow-rollup --no-deny-delete --no-deny-purge --defaults
        || nats stream info LLMRESULT

  prometheus:
    image: prom/prometheus:v3.7.3
    depends_on:
      - llmgate
    ports:
      - "${LLMGATE_PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: "no"

  grafana:
    image: grafana/grafana:12.3.0
    depends_on:
      - prometheus
    ports:
      - "${LLMGATE_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: "no"

  # S3-compatible target for the audit sink. Mirrors the in-cluster MinIO
  # that Loki uses (path-style, plain http), so the client path exercised
  # locally matches prod. Console on :9001.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LLMGATE_AUDIT_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${LLMGATE_AUDIT_S3_SECRET_KEY:-minioadmin}
    ports:
      - "${LLMGATE_MINIO_PORT:-9000}:9000"
      - "${LLMGATE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    restart: "no"

  # Provisions the audit bucket for local testing. llmgate never creates
  # buckets itself (it requires a pre-existing one, like the cluster's
  # Loki buckets), so this fixture stands in for ops provisioning. The mc
  # alias loop doubles as a readiness wait for llmgate's depends_on.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MC_USER: ${LLMGATE_AUDIT_S3_ACCESS_KEY:-minioadmin}
      MC_PASS: ${LLMGATE_AUDIT_S3_SECRET_KEY:-minioadmin}
      MC_BUCKET: ${LLMGATE_AUDIT_S3_BUCKET:-llm-audit}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set local http://minio:9000 "$$MC_USER" "$$MC_PASS"; do sleep 1; done &&
        mc mb --ignore-existing "local/$$MC_BUCKET"
    restart: "no"

volumes:
  minio-data:
  audit-data:
