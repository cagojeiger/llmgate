# Models and Gateway run natively on the Mac. Go and production Rust Caller share a network namespace.
services:
  llmgate:
    build:
      context: ../../..
      args:
        VERSION: local-mlx-validation
    image: llmgate:local-mlx-validation
    # Test-only process: temporary signing key stays 0600 on the host mount.
    user: "0:0"
    ports:
      - "127.0.0.1:${LLMGATE_TEST_PORT:?test port required}:8080"
    environment:
      LLMGATE_ADDR: 0.0.0.0:8080
      LLMGATE_CATALOG: /fixture/catalog
      LLMGATE_CONSUMERS: /fixture/consumers
      LLMGATE_WORKERS_CONFIG: /fixture/workers.json
      LLMGATE_REQUEST_TIMEOUT: 300s
      LLMGATE_COMPLETE_TIMEOUT: 180s
      LLMGATE_STREAM_IDLE_TIMEOUT: 120s
    volumes:
      - "${LLMGATE_TEST_CONFIG:?test config required}:/fixture:ro"
    restart: "no"

  caller:
    build:
      context: ../../../caller
    image: llmgate-caller:local-mlx-validation
    network_mode: service:llmgate
    depends_on: [llmgate]
    # Fixture keys are 0600 on the host. Production mounts them for UID 65532.
    user: "0:0"
    environment:
      LLMGATE_CALLER_CONFIG: /fixture/caller.json
    volumes:
      - "${LLMGATE_TEST_CONFIG:?test config required}:/fixture:ro"
    restart: "no"
