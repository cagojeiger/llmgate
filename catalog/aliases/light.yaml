# light — 최저가·고속·대량 티어 (멀티모달). 사이즈 사다리: light < medium < heavy.
# 권장:  context 256K  /  output 64K        (호출 측 등록 권장값; 512K 컨텍스트도 실측 수용)
# 상한:  context 1M     /  output 128,000    (체인 min = 실제 천장)
# 이미지: ✔ 전원 지원 → 이미지 요청도 폴백까지 안전. 주력(1순위) text+image 지원.
#   qwen3.8-flash context 1,000,000 / output 131,072 / image ✔ (text,image,video)   — 저가·고속 주력
#   glm-5.3-flash context 1,000,000 / output 131,072 / image ✔ (text,image,video,pdf) — 최저가 폴백 (2x usage)
#   mimo-v2.5     context 1,000,000 / output 128,000 / image ✔ (text,image,a/v)     — 무료 최종 폴백 (간헐 지연 있음)
# (OpenCode Go 전용, 한도 출처: models.dev provider=opencode-go, 512K 컨텍스트 실호출 검증)
alias: light
chain:
  - qwen3.8-flash
  - glm-5.3-flash
  - mimo-v2.5
